services:
  rabbit:
    image: rabbitmq:3.12-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service:
        network-deploy-service

  configserver:
    image: "artiprajapati/configserver:s6"
    container_name: configserver_ms
    ports:
      - 8071:8071
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: network-deploy-service

  accounts:
    image: "artiprajapati/accounts:s6"
    container_name: account_ms
    ports:
      - 8080:8080
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "accounts"

  loans:
    image: "artiprajapati/loans:s6"
    container_name: loans_ms
    ports:
      - 8090:8090
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "loans"

  cards:
    image: "artiprajapati/cards:s6"
    container_name: cards_ms
    ports:
      - 9000:9000
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "cards"
networks:
  eazybank:
    driver: "bridge"


